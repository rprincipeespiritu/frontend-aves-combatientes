<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>LinajeGallo</title>

    <!-- CONFIGURACION DEL BACKEND -->
    <script src="config.js"></script>
    <meta name="description" content="Gestiona pedigrí, incubación y genealogía de tu criadero. Prueba gratis 60 días.">
    <link rel="icon" type="image/svg+xml" href="images/icons/app-logo-2.png">
    <link rel="shortcut icon" href="images/icons/app-logo-2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://sapui5.hana.ondemand.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- Meta Pixel: pega tu ID de Events Manager (solo números). Déjalo vacío hasta tenerlo. -->
    <script>
        window.__META_PIXEL_ID__ = "1600457091444675";
    </script>

    <!-- Bootstrap mínimo: suite.ui.commons se carga lazy al abrir Genealogía/Estadísticas -->
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.139.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout"
        data-sap-ui-resourceroots='{
            "com.rprincipees.registroavescombate": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-preload="async">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div 
        data-sap-ui-component 
        data-name="com.rprincipees.registroavescombate" 
        data-id="container" 
        data-settings='{"id" : "registroavescombate"}'>
    </div>
</body>
</html>
